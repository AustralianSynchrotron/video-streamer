[project]
name = "mxcube_video_streamer"
version = "1.8.4.2"
description = "FastAPI Based video streamer"
authors = [{ name = "Marcus Oskarsson", email = "oscarsso@esrf.fr" }]
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = "MIT"
maintainers = [{ name = "Marcus Oskarsson", email = "oscarsso@esrf.fr" }]
keywords = [
    "mxcube",
    "fast-api-streamer",
    "video_streamer",
    "mxcubeweb",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.124.0",
    "numpy>=2.0",
    "opencv-python>=4.10.0.84,<5",
    "pillow>=10.4.0,<11",
    "pydantic>=2.7.0",
    "pydantic-core>=2.20.1",
    "pydantic-settings>=2.4.0",
    "redis>=5.0.0",
    "requests>=2.32.4,<3",
    "typing-extensions>=4.14.1,<5",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
tango = ["pytango>=9.3.6,<10"]

[project.urls]
Homepage = "http://github.com/mxcube/video-streamer"
Repository = "http://github.com/mxcube/video-streamer"
Documentation = "https://mxcube.github.io/video-streamer/"

[project.scripts]
video-streamer = "video_streamer.main:run"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-macros-plugin>=1.3.7,<2",
    "pre-commit==3.5.0",
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["video_streamer"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target_version = ["py38"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pyright]
ignore = ["**/typing_extensions.py"]
pythonVersion = "3.8"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py38"

[tool.ruff.lint]
extend-select = ["B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
